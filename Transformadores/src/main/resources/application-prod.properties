spring.application.name=transformadores

server.port=${SERVER_PORT:8080}
consumidor.service.url=${CONSUMIDOR_SERVICE_URL}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
server.error.include-message=always

spring.cloud.openfeign.client.config.consumidor-service.connectTimeout=${CONSUMIDOR_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.consumidor-service.readTimeout=${CONSUMIDOR_READ_TIMEOUT:2000}

