spring.application.name=transformadores

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:h2:mem:energiaeletrica.db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=max
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always

consumidor.service.url=http://localhost:8081

spring.cloud.openfeign.client.config.consumidor-service.connectTimeout=2000
spring.cloud.openfeign.client.config.consumidor-service.readTimeout=3000

