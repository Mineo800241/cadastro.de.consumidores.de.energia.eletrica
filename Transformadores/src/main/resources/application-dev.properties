spring.application.name=transformadores

server.port=${SERVER_PORT:8080}

consumidor.service.url=${CONSUMIDOR_SERVICE_URL:http://localhost:8081}


spring.datasource.url=jdbc:h2:mem:energiaeletrica.db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=max
spring.datasource.password=

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
server.error.include-message=always

spring.cloud.openfeign.client.config.consumidor-service.connectTimeout=2000
spring.cloud.openfeign.client.config.consumidor-service.readTimeout=3000

spring.batch.jdbc.initialize-schema=always